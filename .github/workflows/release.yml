name: Release

on:
  push:
    tags:
      - 'v*'

# One release per tag; a re-pushed tag cancels the in-flight run.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            ext: .exe
          - goos: darwin
            goarch: amd64
            ext: ''
          - goos: darwin
            goarch: arm64
            ext: ''
          - goos: linux
            goarch: amd64
            ext: ''
          - goos: linux
            goarch: arm64
            ext: ''

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Read the version from go.mod rather than 'stable', so a release is
          # never built by a toolchain the module does not actually claim.
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          # -trimpath strips local paths so builds are reproducible; -s -w drop
          # the symbol table and DWARF data. CGO is off, so the same static
          # binary runs on any glibc/musl host regardless of the runner.
          go build -trimpath -ldflags="-s -w" \
            -o "dist/tre_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.ext }}" .

      - uses: actions/upload-artifact@v4
        with:
          name: tre-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/tre_*
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: tre-*
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          # Only the binaries, so SHA256SUMS.txt cannot hash itself.
          sha256sum tre_* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Smoke test
        run: ./dist/tre_linux_amd64 --help

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            dist/* \
            --title "${{ github.ref_name }}" \
            --generate-notes
